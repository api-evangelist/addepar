aid: addepar
name: Addepar
description: >-
  Addepar is a wealth-management technology and data platform for investment
  portfolio management, analysis, and reporting used by family offices, RIAs,
  private banks, and wealth managers. Its REST API follows the JSON:API
  specification (application/vnd.api+json) and exposes portfolio, transactions,
  positions, entities, groups, attributes, benchmarks, files, jobs, roles,
  teams, and users resources across Portfolio, Ownership Graph, and Admin
  workflows. Access is secured with HTTP Basic authentication (API key/secret
  plus an Addepar-Firm header) or an OAuth 2.0 authorization-code flow with
  granular scopes. Addepar was surfaced as a portfolio company of 8VC and
  Craft Ventures and enriched into the API Evangelist network.
